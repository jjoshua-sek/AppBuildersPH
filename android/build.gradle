buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// llama.rn's JNI target names also exceed Windows limits inside node_modules.
// Configure its native output from the project so dependency reinstalls keep the fix.
project(":llama.rn") {
    plugins.withId("com.android.library") {
        android {
            externalNativeBuild {
                cmake {
                    buildStagingDirectory rootProject.file("../../.cxx/llama")
                }
            }
            defaultConfig {
                externalNativeBuild {
                    cmake {
                        arguments "-DCMAKE_OBJECT_PATH_MAX=250"
                    }
                }
            }
        }
    }
}
